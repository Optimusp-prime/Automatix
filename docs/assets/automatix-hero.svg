<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Automatix — Automata theory, extended.</title>
  <desc id="desc">Une bannière sombre avec trois états d'automate, des transitions bleues et violettes et un signal discret en mouvement.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10162b"/>
      <stop offset="1" stop-color="#181333"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#54d7f5"/>
      <stop offset="1" stop-color="#aa8cff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#528deb" stop-opacity=".20"/>
      <stop offset="1" stop-color="#528deb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="600" cy="150" r="270" fill="url(#halo)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".72">
    <path d="M155 152 C205 82 276 84 320 114"/>
    <path d="M348 128 C430 98 478 92 518 117"/>
    <path d="M676 188 C760 212 828 208 875 161"/>
    <path d="M900 140 C960 98 1017 103 1052 150"/>
  </g>
  <g fill="#172641" stroke="#6bd8f5" stroke-width="2">
    <circle cx="143" cy="166" r="24"/>
    <circle cx="335" cy="123" r="24"/>
    <circle cx="897" cy="145" r="24"/>
    <circle cx="1064" cy="164" r="24"/>
  </g>
  <circle cx="1064" cy="164" r="19" fill="none" stroke="#aa8cff" stroke-width="2"/>
  <g fill="#c4eaf7" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="143" y="171">q0</text>
    <text x="335" y="128">q1</text>
    <text x="897" y="150">q2</text>
    <text x="1064" y="169">q3</text>
  </g>
  <circle cx="199" cy="115" r="4" fill="#83e9ff"/>
  <circle r="4" fill="#83e9ff">
    <animateMotion path="M155 152 C205 82 276 84 320 114" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="148" fill="#f7f9ff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="6" text-anchor="middle">AUTOMATIX</text>
  <text x="600" y="187" fill="#aec2e8" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2" text-anchor="middle">Automata theory, extended.</text>
  <rect x=".5" y=".5" width="1199" height="299" rx="24" fill="none" stroke="#465179" stroke-opacity=".65"/>
</svg>
